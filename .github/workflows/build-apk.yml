name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          export PATH=$ANDROID_HOME/build-tools/34.0.0:$PATH
          cd $GITHUB_WORKSPACE
          mkdir -p build/gen build/obj
          aapt2 compile --dir app/src/main/res -o build/res.zip
          aapt2 link -o build/app.apk -I $ANDROID_HOME/platforms/android-34/android.jar --manifest app/src/main/AndroidManifest.xml --java build/gen -A app/src/main/assets build/res.zip --min-sdk-version 24 --target-sdk-version 34
          javac -d build/obj -cp $ANDROID_HOME/platforms/android-34/android.jar $(find build/gen -name "*.java") app/src/main/java/com/litbusiness/app/MainActivity.java
          d8 --lib $ANDROID_HOME/platforms/android-34/android.jar --min-api 24 --output build/dex $(find build/obj -name "*.class")
          cd build
          mkdir -p apk && cd apk
          unzip -q ../app.apk
          mkdir -p dex && cp ../dex/classes.dex dex/
          cd dex && zip -q -0 ../classes.zip classes.dex && cd ..
          zip -q ../app.apk classes.dex
          cd ..
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          zipalign -f 4 app.apk app-aligned.apk
          apksigner sign --ks debug.keystore --ks-pass:android --out app-signed.apk app-aligned.apk
          mkdir -p $GITHUB_WORKSPACE/output
          cp app-signed.apk $GITHUB_WORKSPACE/output/LIT-Business-Suite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LIT-Business-Suite-APK
          path: output/LIT-Business-Suite.apk
